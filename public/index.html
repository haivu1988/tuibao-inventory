<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14523f">
<title>Tuibao · Quản lý kho</title>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#14523f;--g2:#1c6a50;--sage:#eaf2e8;--paper:#f7f8f4;--ink:#18332b;--muted:#77847f;--line:#e4e9e3;--orange:#c76a2b;--red:#bd5144;--white:#fff;--shadow:0 12px 36px #153f2c14}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1200px)/2));position:sticky;top:0;z-index:5}.brand{font-size:21px;font-weight:850;color:var(--g);letter-spacing:-.5px;display:flex;gap:9px;align-items:center}.brand i{font-style:normal;background:var(--sage);width:34px;height:34px;border-radius:11px;display:grid;place-items:center}.userbox{display:flex;align-items:center;gap:10px}.userbox small{color:var(--muted)}.layout{max-width:1200px;margin:auto;padding:24px 18px 80px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px}.side{position:sticky;top:82px;height:max-content;display:grid;gap:7px}.nav{border:0;background:transparent;text-align:left;border-radius:12px;padding:13px;color:#5c6a64;font-weight:700}.nav.active,.nav:hover{background:var(--sage);color:var(--g)}main{min-width:0}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:4px 0 20px}.heading h1{margin:0;font-size:28px;letter-spacing:-.6px}.heading p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:43px;padding:10px 14px;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:11px;font-weight:750}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn.sage{background:var(--sage);color:var(--g);border-color:#d9e7d8}.btn.danger{color:var(--red)}.btn.full{width:100%}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 1px 2px #102d1f05}.label{font-size:13px;color:var(--muted);font-weight:650}.value{font-size:26px;font-weight:850;margin:7px 0 2px;letter-spacing:-.7px}.sub{font-size:12px;color:var(--muted)}.card-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 13px;font-size:17px}.alert{background:#fff3e8;border:1px solid #f0ddc8;border-radius:15px;padding:14px 16px;margin:14px 0;color:#945126;display:flex;justify-content:space-between;align-items:center;gap:12px}.alert small{display:block;margin-top:3px}.cols{grid-template-columns:1fr 1fr}.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:white;padding:11px 13px;outline-color:#9dbca8}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea{min-height:44px;width:100%;padding:10px 12px;border:1px solid #dce3dc;border-radius:11px;background:white;color:var(--ink);outline-color:#9dbca8}.field textarea{min-height:72px;resize:vertical}.filters{display:flex;gap:7px;overflow:auto;padding:10px 0}.chip{border:1px solid var(--line);background:white;color:#63716b;border-radius:999px;padding:7px 11px;font-weight:650;white-space:nowrap}.chip.active{background:var(--sage);color:var(--g)}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.item-main{display:flex;align-items:flex-start;gap:10px}.icon{width:42px;height:42px;flex:none;object-fit:cover;border-radius:12px;background:var(--sage);display:grid;place-items:center;color:var(--g);font-weight:800}.item-name{font-weight:750}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#eaf4eb;color:#35734b}.pill.low{background:#fff0e7;color:#a75c29}.item-stock{text-align:right}.item-stock b{font-size:18px;display:block}.item-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.small{min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--g);font-weight:700}.history{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 16px;background:#173f31;color:white;border-radius:12px;z-index:40;box-shadow:var(--shadow);font-weight:700}.modal-wrap{position:fixed;inset:0;background:#10241eb0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(570px,100%);max-height:94vh;overflow:auto;background:white;border-radius:20px 20px 14px 14px;box-shadow:var(--shadow)}.modal-head{position:sticky;top:0;background:white;z-index:1;border-bottom:1px solid var(--line);padding:17px 19px;display:flex;justify-content:space-between;align-items:flex-start}.modal-head h2{margin:0;font-size:21px}.modal-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.close{border:0;width:34px;height:34px;border-radius:50%;background:#f2f4f1;font-size:21px}.form{display:grid;gap:13px;padding:17px 19px 22px}.note{background:#f2f5f0;padding:11px;border-radius:11px;color:#58665f;font-size:12px}.stepper{display:grid;grid-template-columns:50px 1fr 50px;gap:7px}.stepper input{text-align:center;font-size:22px;font-weight:850}.stepper button{border:1px solid var(--line);border-radius:11px;background:#f7f8f5;font-size:23px;color:var(--g)}.branch-row{display:flex;gap:8px;flex-wrap:wrap}.branch-check{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);padding:26px}.login h1{margin:0 0 5px;color:var(--g)}.login p{color:var(--muted);margin:0 0 20px}.login .form{padding:8px 0}.mobile-nav{display:none}.empty{padding:25px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;text-align:right;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}@media(max-width:800px){.layout{display:block;padding:17px 13px 86px}.side{display:none}.top{padding:0 13px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:10}.mobile-nav button{border:0;background:none;color:#64716b;font-size:11px;font-weight:700;padding:4px}.mobile-nav button.active{color:var(--g)}.mobile-nav i{font-style:normal;display:block;font-size:19px}.heading{display:block}.heading .actions{margin-top:12px}.actions .btn{flex:1}.modal-wrap{padding:0}.modal{border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}.form{padding:15px}.item-actions .small{flex:1}}
</style>
</head>
<body>
<section id="login" class="login-wrap"><div class="card login"><div class="brand"><i>◈</i> tuibao</div><h1>Đăng nhập kho</h1><p>Dữ liệu dùng chung, cập nhật ngay giữa các tài khoản.</p><form id="loginForm" class="form"><div class="field"><label>Tên đăng nhập</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Mật khẩu</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary full">Đăng nhập</button><div id="loginError" class="sub"></div></form></div></section>
<div id="app" class="hidden"><header class="top"><div class="brand"><i>◈</i> tuibao <span class="sub">· quản lý kho</span></div><div class="userbox"><small id="who"></small><button class="btn" onclick="logout()">Thoát</button></div></header><div class="layout"><nav id="side" class="side"></nav><main id="main"></main></div><nav id="mobileNav" class="mobile-nav"></nav></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const { createClient } = window.supabase;
const cfg = window.TUIBAO_CONFIG;
if (!cfg?.supabaseUrl || !cfg?.supabasePublishableKey) throw new Error('Thiếu cấu hình Supabase trong config.js');
const sb = createClient(cfg.supabaseUrl, cfg.supabasePublishableKey);
let me=null, profile=null, branches=[], items=[], inventory=[], tx=[], people=[], page='home', selectedBranch='', searchText='', category='Tất cả', period='day', dateValue=new Date().toISOString().slice(0,10), filterUser='', liveChannel=null, refreshTimer=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){$('toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('toastRoot').replaceChildren(),2800)}
function manager(){return profile?.role==='manager'}
function myBranch(){return manager()?selectedBranch:profile?.branch_id}
function branchName(id){return branches.find(b=>b.id===id)?.name||'Chi nhánh'}
function unitName(id){return items.find(i=>i.id===id)?.unit||''}
function money(n){return Number(n||0).toLocaleString('vi-VN')+' ₫'}
function fmtQty(n){return Number(n||0).toLocaleString('vi-VN',{maximumFractionDigits:3})}
async function login(e){e.preventDefault();$('loginError').textContent='';let username=$('loginUser').value.trim().toLowerCase(),password=$('loginPass').value;let {data,error}=await sb.auth.signInWithPassword({email:`${username}@tuibao.invalid`,password});if(error){$('loginError').textContent='Tên đăng nhập hoặc mật khẩu chưa đúng.';return}me=data.user;await enterApp()}
async function enterApp(){let {data,error}=await sb.from('profiles').select('user_id,username,full_name,role,branch_id').eq('user_id',me.id).single();if(error||!data){await sb.auth.signOut();$('loginError').textContent='Tài khoản chưa được gán vai trò. Hãy liên hệ Quản lý.';return}profile=data;selectedBranch=manager()?'':profile.branch_id;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${profile.full_name} · ${manager()?'Quản lý':branchName(profile.branch_id)}`;await loadData();render();subscribeLive()}
async function logout(){if(liveChannel)await sb.removeChannel(liveChannel);await sb.auth.signOut();profile=null;me=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function loadData(){let [br,ing,inv,tr,pe]=await Promise.all([
 sb.from('branches').select('*').order('name'),sb.from('ingredients').select('*').order('name'),sb.from('inventory').select('*'),
 sb.from('stock_transactions').select('*').order('created_at',{ascending:false}).limit(500),
 manager()?sb.from('profiles').select('user_id,username,full_name,role,branch_id').eq('role','staff').order('full_name'):Promise.resolve({data:[]})
]);for(const r of [br,ing,inv,tr,pe])if(r.error){toast(r.error.message);return}branches=(br.data||[]).filter(b=>b.is_active||manager());items=ing.data||[];inventory=inv.data||[];tx=tr.data||[];people=pe.data||[];if(manager()&&!branches.some(b=>b.id===selectedBranch))selectedBranch=branches.find(b=>b.is_active)?.id||'';}
function subscribeLive(){if(liveChannel)sb.removeChannel(liveChannel);liveChannel=sb.channel('tuibao-inventory-live').on('postgres_changes',{event:'*',schema:'public',table:'inventory'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'stock_transactions'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'ingredients'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'branches'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},scheduleRefresh).subscribe()}
function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(async()=>{await loadData();render()},250)}
const navs=[['home','⌂','Tổng quan'],['stock','▦','Kho'],['history','↻','Xuất kho'],['manage','⚙','Quản lý']];
function navHtml(){return navs.filter(n=>n[0]!=='manage'||manager()).map(([k,ico,label])=>`<button class="nav ${page===k?'active':''}" onclick="go('${k}')">${ico} ${label}</button>`).join('')}
function render(){if(!profile)return;$('side').innerHTML=navHtml();$('mobileNav').innerHTML=navs.filter(n=>n[0]!=='manage'||manager()).map(([k,ico,label])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><i>${ico}</i>${label}</button>`).join('');$('main').innerHTML=page==='home'?homePage():page==='stock'?stockPage():page==='history'?historyPage():managePage()}
function go(p){page=p;render()}
function inventoryFor(branchId){return inventory.filter(r=>r.branch_id===branchId&&r.is_available&&items.some(i=>i.id===r.ingredient_id&&i.is_active))}
function lowRows(branchId){return inventoryFor(branchId).filter(r=>Number(r.quantity)<Number(r.minimum_quantity)).map(r=>({r,i:items.find(i=>i.id===r.ingredient_id)}))}
function homePage(){let bid=myBranch(),rows=inventoryFor(bid),lows=lowRows(bid),value=rows.reduce((a,r)=>a+Number(r.quantity)*Number(items.find(i=>i.id===r.ingredient_id)?.unit_price||0),0);return `<div class="heading"><div><h1>Tổng quan kho</h1><p>Nhập và xuất nhanh. Thay đổi đồng bộ giữa các tài khoản.</p></div><div class="actions"><button class="btn primary" onclick="openStockForm('out')">↗ Xuất kho</button><button class="btn sage" onclick="openStockForm('in')">↓ Nhập kho</button>${manager()?`<button class="btn" onclick="openStockForm('adjust')">± Điều chỉnh</button><button class="btn" onclick="openStockForm('transfer')">⇄ Chuyển kho</button>`:''}</div></div>${manager()?`<div class="field" style="margin-bottom:14px"><label>Chi nhánh đang xem</label><select onchange="selectedBranch=this.value;render()">${branches.filter(b=>b.is_active).map(b=>`<option value="${b.id}" ${b.id===bid?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`:`<div class="note" style="margin-bottom:14px">Chi nhánh của bạn: ${esc(branchName(bid))}</div>`}<div class="grid metrics"><div class="card"><div class="label">Mặt hàng tại chi nhánh</div><div class="value">${rows.length}</div></div><div class="card"><div class="label">Giá trị tồn ước tính</div><div class="value">${money(value)}</div></div><div class="card"><div class="label">Cần nhập thêm</div><div class="value" style="color:var(--orange)">${lows.length}</div></div><div class="card"><div class="label">Chi nhánh hoạt động</div><div class="value">${branches.filter(b=>b.is_active).length}</div></div></div><div class="alert"><div><b>⚠ ${lows.length} mặt hàng dưới mức tối thiểu</b><small>Danh sách được cập nhật realtime.</small></div><button class="btn" onclick="go('stock')">Xem kho →</button></div><div class="grid cols"><section class="card"><h2 class="card-title">Cần nhập thêm</h2>${lows.slice(0,6).map(({r,i})=>`<div class="history"><div><b>${esc(i.name)}</b><div class="sub">Còn ${fmtQty(r.quantity)} / tối thiểu ${fmtQty(r.minimum_quantity)} ${esc(i.unit)}</div></div><button class="small" onclick="openStockForm('in','${i.id}','${bid}')">+ Nhập</button></div>`).join('')||'<div class="empty">Kho hiện không có mặt hàng dưới mức.</div>'}</section><section class="card"><h2 class="card-title">Hoạt động gần đây</h2>${tx.filter(t=>manager()||t.branch_id===bid).slice(0,6).map(txRow).join('')||'<div class="empty">Chưa có giao dịch.</div>'}</section></div>`}
function stockPage(){let bid=myBranch(),rows=inventoryFor(bid).map(r=>({r,i:items.find(i=>i.id===r.ingredient_id)})).filter(x=>x.i&&(!searchText||`${x.i.name} ${x.i.code}`.toLowerCase().includes(searchText.toLowerCase()))&& (category==='Tất cả'||x.i.category===category));let cats=['Tất cả',...new Set(items.filter(i=>i.is_active).map(i=>i.category))];return `<div class="heading"><div><h1>Kho nguyên liệu</h1><p>${esc(branchName(bid))}</p></div><div class="actions"><button class="btn primary" onclick="openStockForm('out')">↗ Xuất</button><button class="btn sage" onclick="openStockForm('in')">↓ Nhập</button>${manager()?'<button class="btn" onclick="ingredientForm()">＋ Thêm nguyên liệu</button>':''}</div></div><input class="search" placeholder="⌕ Tìm tên hoặc mã nguyên liệu" value="${esc(searchText)}" oninput="searchText=this.value;render()"><div class="filters">${cats.map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><div class="list">${rows.map(({r,i})=>`<article class="item"><div class="item-main">${i.image_path?`<img class="icon" src="${esc(sb.storage.from('ingredient-images').getPublicUrl(i.image_path).data.publicUrl)}">`:`<div class="icon">${esc(i.code.slice(-2))}</div>`}<div><div class="item-name">${esc(i.name)}</div><div class="sub">${esc(i.code)} · ${esc(i.category)} · ${esc(i.unit)}</div><div style="margin-top:6px"><span class="pill ${Number(r.quantity)<Number(r.minimum_quantity)?'low':''}">${Number(r.quantity)<Number(r.minimum_quantity)?'Cần nhập':'Đủ tồn'}</span> <span class="sub">Tối thiểu ${fmtQty(r.minimum_quantity)}</span></div></div></div><div class="item-stock"><b>${fmtQty(r.quantity)}</b><span class="sub">${esc(i.unit)}</span></div><div class="item-actions"><button class="small" onclick="openStockForm('in','${i.id}','${bid}')">↓ Nhập</button><button class="small" onclick="openStockForm('out','${i.id}','${bid}')">↗ Xuất</button>${manager()?`<button class="small" onclick="openStockForm('adjust','${i.id}','${bid}')">± Điều chỉnh</button><button class="small" onclick="openStockForm('transfer','${i.id}','${bid}')">⇄ Chuyển</button><button class="small" onclick="ingredientForm('${i.id}')">Sửa</button><button class="small" onclick="archiveIngredient('${i.id}')">Lưu trữ</button>`:''}</div></article>`).join('')||'<div class="empty">Chưa có nguyên liệu trong chi nhánh này.</div>'}</div>`}
function txRow(t){let i=items.find(x=>x.id===t.ingredient_id);return `<div class="history"><div><b>${({in:'Nhập kho',out:'Xuất kho',adjust:'Điều chỉnh',transfer:'Chuyển kho'})[t.kind]} · ${esc(i?.name||'Nguyên liệu')}</b><div class="sub">${new Date(t.created_at).toLocaleString('vi-VN')} · ${esc(branchName(t.branch_id))}${t.destination_branch_id?' → '+esc(branchName(t.destination_branch_id)):''}</div><div class="sub">${esc(t.note||'')}</div></div><div style="text-align:right"><b>${fmtQty(t.quantity)} ${esc(i?.unit||'')}</b></div></div>`}
function periodBounds(){let d=new Date(dateValue+'T00:00:00'),s=new Date(d),e=new Date(d);if(period==='week'){s.setDate(d.getDate()-(d.getDay()+6)%7);e=new Date(s);e.setDate(s.getDate()+6)}else if(period==='month'){s.setDate(1);e=new Date(d.getFullYear(),d.getMonth()+1,0)}else if(period==='year'){s=new Date(d.getFullYear(),0,1);e=new Date(d.getFullYear(),11,31)}return [s.toISOString(),new Date(e.getFullYear(),e.getMonth(),e.getDate(),23,59,59,999).toISOString()]}
function historyPage(){let [start,end]=periodBounds(),bid=manager()?selectedBranch:profile.branch_id,rows=tx.filter(t=>t.kind==='out'&&t.created_at>=start&&t.created_at<=end&&(manager()?(!bid||t.branch_id===bid):t.branch_id===bid)&&(!filterUser||people.find(p=>p.user_id===t.actor_id)?.full_name.toLowerCase().includes(filterUser.toLowerCase())));let who=new Map(people.map(p=>[p.user_id,p.full_name]));return `<div class="heading"><div><h1>Tra cứu xuất kho</h1><p>Nhân viên, mặt hàng và số lượng theo kỳ.</p></div></div><section class="card"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(145px,1fr))"><div class="field"><label>Kỳ</label><select onchange="period=this.value;render()"><option value="day" ${period==='day'?'selected':''}>Ngày</option><option value="week" ${period==='week'?'selected':''}>Tuần</option><option value="month" ${period==='month'?'selected':''}>Tháng</option><option value="year" ${period==='year'?'selected':''}>Năm</option></select></div><div class="field"><label>Chọn ngày trong kỳ</label><input type="date" value="${dateValue}" onchange="dateValue=this.value;render()"></div>${manager()?`<div class="field"><label>Chi nhánh</label><select onchange="selectedBranch=this.value;render()"><option value="">Tất cả chi nhánh</option>${branches.filter(b=>b.is_active).map(b=>`<option value="${b.id}" ${b.id===selectedBranch?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`:''}<div class="field"><label>Tìm nhân viên</label><input value="${esc(filterUser)}" placeholder="Tên nhân viên" onchange="filterUser=this.value;render()"></div></div></section><section class="card" style="margin-top:14px"><h2 class="card-title">${rows.length} lượt xuất kho</h2>${rows.map(t=>`<div class="history"><div><b>${esc(items.find(i=>i.id===t.ingredient_id)?.name||'Nguyên liệu')}</b><div class="sub">${new Date(t.created_at).toLocaleString('vi-VN')} · ${esc(branchName(t.branch_id))}</div><div class="sub">Nhân viên: ${esc(who.get(t.actor_id)||'')}</div><div class="sub">${esc(t.note||'')}</div></div><div style="text-align:right"><b>−${fmtQty(t.quantity)} ${esc(unitName(t.ingredient_id))}</b></div></div>`).join('')||'<div class="empty">Không có lượt xuất trong kỳ đã chọn.</div>'}</section>`}
function managePage(){if(!manager())return '<div class="empty">Chức năng chỉ dành cho Quản lý.</div>';return `<div class="heading"><div><h1>Quản lý</h1><p>Tài khoản, chi nhánh, điều chỉnh và chuyển kho.</p></div><div class="actions"><button class="btn primary" onclick="accountForm()">＋ Tạo tài khoản nhân viên</button><button class="btn sage" onclick="branchForm()">＋ Thêm chi nhánh</button></div></div><section class="card"><h2 class="card-title">Tài khoản nhân viên</h2>${people.map(p=>`<div class="history"><div><b>${esc(p.full_name)}</b><div class="sub">${esc(p.username)} · ${esc(branchName(p.branch_id))}</div></div><button class="small" onclick="editStaff('${p.user_id}')">Sửa</button></div>`).join('')||'<div class="empty">Chưa có tài khoản nhân viên.</div>'}</section><section class="card" style="margin-top:14px"><h2 class="card-title">Chi nhánh</h2>${branches.map(b=>`<div class="history"><div><b>${esc(b.name)}</b><div class="sub">${b.is_active?'Đang hoạt động':'Đã lưu trữ'}</div></div><div><button class="small" onclick="branchForm('${b.id}')">Sửa</button> <button class="small" onclick="archiveBranch('${b.id}')">Lưu trữ</button></div></div>`).join('')}</section><section class="card" style="margin-top:14px"><h2 class="card-title">Thao tác Quản lý</h2><div class="actions"><button class="btn sage" onclick="openStockForm('adjust')">± Điều chỉnh số lượng</button><button class="btn sage" onclick="openStockForm('transfer')">⇄ Chuyển kho</button></div></section>`}
function modal(title,subtitle,body){$('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><section class="modal"><header class="modal-head"><div><h2>${esc(title)}</h2><p>${esc(subtitle||'')}</p></div><button class="close" onclick="closeModal()">×</button></header><form class="form" id="activeForm">${body}</form></section></div>`}
function closeModal(){$('modalRoot').replaceChildren()}
function branchesSelect(id,selected,all=false){return `<select id="${id}">${branches.filter(b=>all||b.is_active).map(b=>`<option value="${b.id}" ${b.id===selected?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`}
function openStockForm(kind,ingredientId='',branchId=myBranch()) {let title={in:'Nhập kho',out:'Xuất kho',adjust:'Điều chỉnh số lượng',transfer:'Chuyển kho'}[kind];if(!manager()&&!['in','out'].includes(kind)){toast('Nhân viên chỉ được nhập và xuất kho.');return}let inv=inventoryFor(branchId),picked=ingredientId||inv[0]?.ingredient_id,ops=inv.map(r=>{let i=items.find(x=>x.id===r.ingredient_id);return i?`<option value="${i.id}" ${i.id===picked?'selected':''}>${esc(i.code)} · ${esc(i.name)}</option>`:''}).join('');let body=`${manager()?`<div class="field"><label>Chi nhánh nguồn</label>${branchesSelect('opBranch',branchId)}</div>`:`<div class="note">${esc(branchName(branchId))}</div>`}<div class="field"><label>Nguyên liệu</label><select id="opItem">${ops}</select></div>${kind==='transfer'?`<div class="field"><label>Chi nhánh nhận</label>${branchesSelect('opDestination',branches.find(b=>b.id!==branchId&&b.is_active)?.id)}</div>`:''}<div class="field"><label>${kind==='adjust'?'Số đếm thực tế':'Số lượng'} · <span id="opUnit">${esc(unitName(picked))}</span></label><div class="stepper"><button type="button" onclick="step('opQty',-1,${kind==='adjust'?0:1})">−</button><input id="opQty" type="number" min="${kind==='adjust'?0:1}" step="1" value="${kind==='adjust'?inventory.find(r=>r.branch_id===branchId&&r.ingredient_id===picked)?.quantity||0:1}" required><button type="button" onclick="step('opQty',1,${kind==='adjust'?0:1})">+</button></div></div><div class="field"><label>Ghi chú ${kind==='adjust'?'*':'(không bắt buộc)'}</label><textarea id="opNote" ${kind==='adjust'?'required':''}></textarea></div><button class="btn primary full">Xác nhận ${title.toLowerCase()}</button>`;modal(title,'Giao dịch được lưu vào lịch sử và đồng bộ realtime.',body);$('opBranch')?.addEventListener('change',e=>{openStockForm(kind,'',e.target.value)});$('opItem')?.addEventListener('change',e=>{let it=items.find(x=>x.id===e.target.value);$('opUnit').textContent=it?.unit||''});$('activeForm').onsubmit=e=>saveStockOperation(e,kind)}
function step(id,d,min){$(id).value=Math.max(min,(Number($(id).value)||0)+d)}
async function saveStockOperation(e,kind){e.preventDefault();let branchId=$('opBranch')?.value||profile.branch_id,itemId=$('opItem').value,qty=Number($('opQty').value),note=$('opNote').value.trim(),destination=$('opDestination')?.value||null;let {error}=await sb.rpc('apply_stock_operation',{p_kind:kind,p_branch_id:branchId,p_ingredient_id:itemId,p_quantity:qty,p_note:note,p_destination_branch_id:destination});if(error){toast(error.message);return}closeModal();await loadData();render();toast('Đã ghi giao dịch')}
function ingredientForm(id=''){let x=items.find(i=>i.id===id),assigned=inventory.filter(r=>r.ingredient_id===id);let body=`<div class="field"><label>Tên nguyên liệu *</label><input id="ingName" required value="${esc(x?.name||'')}"></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Mã hàng *</label><input id="ingCode" required value="${esc(x?.code||'')}"></div><div class="field"><label>Nhóm</label><input id="ingCat" value="${esc(x?.category||'Khác')}"></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Đơn vị *</label><input id="ingUnit" required value="${esc(x?.unit||'')}"></div><div class="field"><label>Giá nhập tham khảo</label><input id="ingPrice" type="number" min="0" value="${x?.unit_price||0}"></div></div><div class="field"><label>Chi nhánh có nguyên liệu</label><div class="branch-row">${branches.filter(b=>b.is_active).map(b=>{let r=assigned.find(q=>q.branch_id===b.id);return `<label class="branch-check"><input type="checkbox" class="ingBranch" value="${b.id}" ${r?.is_available?'checked':''}>${esc(b.name)}</label>`}).join('')}</div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(145px,1fr))">${branches.filter(b=>b.is_active).map(b=>{let r=assigned.find(q=>q.branch_id===b.id);return `<div class="field"><label>Tồn ban đầu · ${esc(b.name)}</label><input class="ingQty" data-branch="${b.id}" type="number" min="0" value="${r?.quantity||0}"><input class="ingMin" data-branch="${b.id}" type="number" min="0" value="${r?.minimum_quantity||0}" placeholder="Tồn tối thiểu"></div>`}).join('')}</div><div class="field"><label>Ảnh nguyên liệu</label><input id="ingImage" type="file" accept="image/jpeg,image/png,image/webp"><span class="sub">Tối đa 5 MB.</span></div><button class="btn primary full">${x?'Lưu thay đổi':'Thêm nguyên liệu'}</button>`;modal(x?'Sửa nguyên liệu':'Thêm nguyên liệu','Gán mặt hàng cho một hoặc nhiều chi nhánh.',body);$('activeForm').onsubmit=e=>saveIngredient(e,id)}
async function saveIngredient(e,id){e.preventDefault();let data={name:$('ingName').value.trim(),code:$('ingCode').value.trim(),category:$('ingCat').value.trim()||'Khác',unit:$('ingUnit').value.trim(),unit_price:Number($('ingPrice').value)||0};let selected=[...document.querySelectorAll('.ingBranch:checked')].map(x=>x.value);if(!selected.length){toast('Chọn ít nhất một chi nhánh.');return}let existing=inventory.filter(r=>r.ingredient_id===id);for(const r of existing)if(!selected.includes(r.branch_id)&&Number(r.quantity)>0){toast('Chi nhánh còn tồn; hãy chuyển hoặc điều chỉnh hết trước khi bỏ gán.');return}let file=$('ingImage').files?.[0],imagePath=items.find(i=>i.id===id)?.image_path;if(file){if(file.size>5242880){toast('Ảnh vượt quá 5 MB.');return}let path=`${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,up=await sb.storage.from('ingredient-images').upload(path,file,{upsert:false});if(up.error){toast(up.error.message);return}imagePath=path}if(imagePath)data.image_path=imagePath;let res=id?await sb.from('ingredients').update(data).eq('id',id).select().single():await sb.from('ingredients').insert(data).select().single();if(res.error){toast(res.error.message);return}let ingredientId=id||res.data.id;for(const b of branches.filter(b=>b.is_active)){let checked=selected.includes(b.id),old=existing.find(r=>r.branch_id===b.id),qty=Number(document.querySelector(`.ingQty[data-branch="${b.id}"]`)?.value)||0,min=Number(document.querySelector(`.ingMin[data-branch="${b.id}"]`)?.value)||0;if(old){let change=await sb.from('inventory').update({is_available:checked,minimum_quantity:min,...(checked?{quantity:qty}:{})}).eq('branch_id',b.id).eq('ingredient_id',ingredientId);if(change.error){toast(change.error.message);return}}else if(checked){let add=await sb.from('inventory').insert({branch_id:b.id,ingredient_id:ingredientId,quantity:qty,minimum_quantity:min,is_available:true});if(add.error){toast(add.error.message);return}}}closeModal();await loadData();render();toast(id?'Đã cập nhật nguyên liệu':'Đã thêm nguyên liệu')}
async function archiveIngredient(id){if(!confirm('Lưu trữ nguyên liệu? Lịch sử giao dịch vẫn được giữ.'))return;let {error}=await sb.from('ingredients').update({is_active:false}).eq('id',id);if(error)toast(error.message);else{await loadData();render();toast('Đã lưu trữ nguyên liệu')}}
function accountForm(){let body=`<div class="field"><label>Tên nhân viên *</label><input id="staffName" required></div><div class="field"><label>Tên đăng nhập *</label><input id="staffUser" required minlength="3"></div><div class="field"><label>Chi nhánh</label>${branchesSelect('staffBranch',branches.find(b=>b.is_active)?.id)}</div><div class="field"><label>Mật khẩu khởi tạo *</label><input id="staffPass" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Xác nhận mật khẩu *</label><input id="staffConfirm" type="password" minlength="8" required></div><button class="btn primary full">Tạo tài khoản nhân viên</button>`;modal('Tạo tài khoản nhân viên','Chỉ Quản lý tạo được tài khoản. Mật khẩu được xử lý phía server.',body);$('activeForm').onsubmit=async e=>{e.preventDefault();if($('staffPass').value!==$('staffConfirm').value){toast('Mật khẩu xác nhận chưa khớp.');return}let {data,error}=await sb.functions.invoke('create-staff',{body:{username:$('staffUser').value.trim(),full_name:$('staffName').value.trim(),password:$('staffPass').value,branch_id:$('staffBranch').value}});if(error){let message=error.message;try{const response=error.context;if(response&&typeof response.clone==='function'){const detail=await response.clone().json();message=detail.error||detail.message||message}}catch{}toast(message);return}closeModal();await loadData();render();toast('Đã tạo tài khoản '+data.username)}}
async function editStaff(id){let p=people.find(x=>x.user_id===id);if(!p)return;let body=`<div class="field"><label>Tên hiển thị</label><input id="staffName" value="${esc(p.full_name)}"></div><div class="field"><label>Chi nhánh</label>${branchesSelect('staffBranch',p.branch_id)}</div><button class="btn primary full">Lưu thay đổi</button>`;modal('Sửa nhân viên',p.username,body);$('activeForm').onsubmit=async e=>{e.preventDefault();let {error}=await sb.from('profiles').update({full_name:$('staffName').value.trim(),branch_id:$('staffBranch').value}).eq('user_id',id);if(error){toast(error.message);return}closeModal();await loadData();render();toast('Đã cập nhật nhân viên')}}
function branchForm(id=''){let b=branches.find(x=>x.id===id),body=`<div class="field"><label>Tên chi nhánh *</label><input id="branchName" required value="${esc(b?.name||'')}"></div><button class="btn primary full">${b?'Lưu chi nhánh':'Thêm chi nhánh'}</button>`;modal(b?'Sửa chi nhánh':'Thêm chi nhánh','Chi nhánh đã có giao dịch sẽ được lưu trữ thay vì xóa để giữ lịch sử.',body);$('activeForm').onsubmit=async e=>{e.preventDefault();let name=$('branchName').value.trim(),res=b?await sb.from('branches').update({name}).eq('id',id):await sb.from('branches').insert({name});if(res.error){toast(res.error.message);return}closeModal();await loadData();render();toast(b?'Đã cập nhật chi nhánh':'Đã thêm chi nhánh')}}
async function archiveBranch(id){if(!manager())return;let assigned=people.some(p=>p.branch_id===id),hasStock=inventory.some(r=>r.branch_id===id&&Number(r.quantity)>0);if(assigned||hasStock){toast(assigned?'Chuyển nhân viên sang chi nhánh khác trước.':'Chuyển hoặc điều chỉnh hết tồn trước.');return}let {error}=await sb.from('branches').update({is_active:false}).eq('id',id);if(error)toast(error.message);else{await loadData();render();toast('Đã lưu trữ chi nhánh; lịch sử vẫn được giữ.')}}
async function renderMonthly(){let [start,end]=periodBounds(),bid=myBranch();let q=sb.from('stock_transactions').select('*').eq('kind','out').gte('created_at',start).lte('created_at',end);if(!manager())q=q.eq('branch_id',bid);let {data,error}=await q;if(error){toast(error.message);return}return data||[]}
async function render(){if(!profile)return;$('side').innerHTML=navHtml();$('mobileNav').innerHTML=navs.filter(n=>n[0]!=='manage'||manager()).map(([k,ico,label])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><i>${ico}</i>${label}</button>`).join('');$('main').innerHTML=page==='home'?homePage():page==='stock'?stockPage():page==='history'?historyPage():managePage()}
async function init(){let {data}=await sb.auth.getSession();if(data.session){me=data.session.user;await enterApp()}else{$('login').classList.remove('hidden')}}
$('loginForm').addEventListener('submit',login);init();
</script></body></html>
